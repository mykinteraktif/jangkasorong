<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Gim edukasi pengukuran jangka sorong untuk siswa SMK Teknik Otomotif Fase E">
<title>Pengukuran Jangka Sorong Otomotif</title>
<style>/* ===== Pengukuran Jangka Sorong Otomotif — gaya utama ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050b14;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#0d1b2a;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
:root{
  --navy:#0a1d38;--navy2:#123465;--blue:#1d6fe0;--blue2:#3b93ff;--sky:#bfe0ff;
  --yellow:#ffc61a;--amber:#ff9f0a;--orange:#ff7a00;--red:#e2362f;--green:#22a447;--green2:#43d16a;
  --steel:#cfd8e3;--ink:#0d1b2a;--paper:#f5f8fc;--muted:#5b6b7f;--line:#d6e0ec;
}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;background:#0e1c2e;z-index:1}
#bg{position:absolute;inset:0;z-index:0}
#bg svg{width:100%;height:100%;display:block}
#screen{position:absolute;inset:0;z-index:2}
.dimmer{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,30,.74),rgba(6,16,30,.6) 40%,rgba(6,16,30,.8))}
#bg{transition:filter .3s}#bg.soft{filter:blur(2.5px)}
.dimmer.light{background:linear-gradient(180deg,rgba(6,16,30,.45),rgba(6,16,30,.2) 45%,rgba(6,16,30,.55))}
.scr{position:absolute;inset:0;animation:scrIn .28s ease-out}
@keyframes scrIn{from{transform:translateY(10px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== HUD ===== */
.hud{position:absolute;left:0;right:0;top:0;height:70px;display:flex;align-items:center;padding:0 16px;gap:12px;z-index:5}
.hud .minilogo{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 6px;border-radius:12px}
.hud .minilogo:focus-visible{outline:3px solid var(--yellow)}
.minilogo .mt{display:flex;flex-direction:column;line-height:1}
.minilogo .mt b{font-size:11px;font-style:italic;font-weight:900;color:#fff;background:var(--blue);padding:2px 8px;border-radius:4px;transform:skewX(-10deg);display:inline-block;letter-spacing:.5px}
.minilogo .mt i{font-size:15px;font-weight:900;font-style:italic;color:var(--yellow);background:linear-gradient(180deg,#e8322b,#a5130f);padding:3px 9px;border-radius:5px;transform:skewX(-10deg);margin-top:2px;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.35);border:2px solid #ffd76a}
.minilogo .mt s{text-decoration:none;font-size:9px;font-weight:800;font-style:italic;color:#1d2b3a;background:linear-gradient(180deg,#f2f5f8,#aeb9c5);padding:1px 8px;border-radius:3px;transform:skewX(-10deg);margin-top:2px;align-self:flex-start;letter-spacing:1.2px}
.banner{flex:1;display:flex;justify-content:center}
.banner span{position:relative;display:inline-flex;align-items:center;gap:10px;padding:8px 46px;font-size:24px;font-weight:900;font-style:italic;color:#fff;background:linear-gradient(180deg,#1f5fc4,#0d2f6b);border:3px solid #4fa3ff;border-radius:10px;transform:skewX(-12deg);box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.25);text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
.banner span>em{font-style:inherit;transform:skewX(12deg);display:inline-flex;align-items:center;gap:10px}
.banner span::before,.banner span::after{content:"";position:absolute;top:6px;bottom:6px;width:22px;background:repeating-linear-gradient(90deg,var(--yellow) 0 5px,transparent 5px 9px)}
.banner span::before{left:10px}.banner span::after{right:10px}
.hud .tools{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(5,15,30,.75);border:2px solid #3a6ea8;color:#fff;font-weight:800;font-size:15px;padding:6px 12px;border-radius:999px}
.chip svg{width:18px;height:18px}
.ibtn{width:44px;height:44px;border-radius:12px;background:rgba(5,15,30,.75);border:2px solid #3a6ea8;color:#fff;display:grid;place-items:center;transition:transform .15s,background .15s}
.ibtn:hover{transform:scale(1.07);background:#1b4f97}
.ibtn:focus-visible{outline:3px solid var(--yellow)}
.ibtn svg{width:22px;height:22px}
.ibtn.off{opacity:.55}
.gprog{position:absolute;left:0;right:0;top:0;height:5px;background:rgba(255,255,255,.08);z-index:6}
.gprog i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--green2));width:0;transition:width .4s}

/* ===== Navigasi bawah ===== */
.bnav{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:14px;z-index:5}
.bnav .mid{display:flex;gap:12px;align-items:center}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.3px;font-size:19px;color:#fff;padding:0 26px;height:56px;border-radius:16px;border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 0 rgba(0,0,0,.28),0 10px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .14s,filter .14s,box-shadow .14s;white-space:nowrap}
.btn:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.1)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28),0 4px 10px rgba(0,0,0,.35)}
.btn:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.btn[disabled]{filter:grayscale(.8) brightness(.8);cursor:not-allowed;transform:none}
.btn svg{width:24px;height:24px;flex:none}
.b-blue{background:linear-gradient(180deg,#3d9bff,#1658c4 60%,#0f469f)}
.b-yellow{background:linear-gradient(180deg,#ffe066,#ffb703 55%,#f08c00);color:#1d1300;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.b-green{background:linear-gradient(180deg,#5ee27f,#1e9e44 60%,#147a33)}
.b-red{background:linear-gradient(180deg,#ff6b5e,#d62c22 60%,#a51b14)}
.b-dark{background:linear-gradient(180deg,#3b4a5e,#1d2838);border-color:#7d93ad}
.b-sm{height:44px;font-size:15px;padding:0 16px;border-radius:12px;border-width:2px}
.b-xs{height:36px;font-size:13px;padding:0 12px;border-radius:10px;border-width:2px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.stepchip{display:flex;flex-direction:column;align-items:center;gap:5px;background:rgba(5,15,30,.8);border:2px solid #3a6ea8;border-radius:14px;padding:7px 16px;color:#fff;min-width:250px}
.stepchip b{font-size:14px;font-weight:800;letter-spacing:.3px}
.stepchip .bar{display:flex;gap:4px;width:100%}
.stepchip .bar i{flex:1;height:9px;border-radius:5px;background:#3c4b5f}
.stepchip .bar i.on{background:linear-gradient(90deg,#43d16a,#1e9e44)}
.stepchip .bar i.cur{background:linear-gradient(90deg,#ffe066,#ffb703)}

/* ===== Panel ===== */
.panel{position:absolute;background:linear-gradient(180deg,#fbfdff,#eaf1f9);border:3px solid #2f7de0;border-radius:18px;box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.7);color:var(--ink);overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#2a74d8,#123f8a);color:#fff;font-weight:900;font-style:italic;font-size:17px;padding:9px 14px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.panel .ph svg{width:22px;height:22px}
.panel .pb{padding:12px 14px}
.panel.dark{background:linear-gradient(180deg,rgba(8,24,46,.92),rgba(6,18,36,.95));color:#eaf2ff;border-color:#3a7fd6}
.subh{display:inline-block;background:linear-gradient(90deg,#1f63c6,#3b93ff);color:#fff;font-weight:900;font-style:italic;font-size:14px;padding:4px 14px;border-radius:6px;margin:4px 0 6px;transform:skewX(-8deg)}
.steps{list-style:none;display:flex;flex-direction:column;gap:7px}
.steps li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.35;color:#1a2a3c}
.steps li .n{flex:none;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe680,#f5a800);color:#3a2500;font-weight:900;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.steps li.done .n{background:radial-gradient(circle at 35% 30%,#7af09a,#1e9e44);color:#fff}
.steps li.cur{font-weight:700}
.steps li.cur .n{box-shadow:0 0 0 3px rgba(29,111,224,.45)}

/* ===== Input jawaban ===== */
.ansrow{display:flex;align-items:center;gap:8px}
.ans{flex:1;min-width:0;height:50px;border-radius:12px;border:3px solid #9fb6cf;background:#fff;font-size:24px;font-weight:800;text-align:center;color:#0d1b2a;outline:none}
.ans:focus{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(59,147,255,.25)}
.ans.ok{border-color:var(--green);background:#eafff0}
.ans.bad{border-color:var(--red);background:#fff0ef;animation:shake .35s}
.ansrow .u{font-size:22px;font-weight:900;color:#0d1b2a}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.status{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 12px;font-weight:800;font-size:14.5px;line-height:1.3}
.status.ok{background:#e3f9e9;border:2px solid #4cc46d;color:#11632b}
.status.bad{background:#ffeceb;border:2px solid #f08a83;color:#9a1d16}
.status.info{background:#e7f1ff;border:2px solid #8bbcf5;color:#123f8a}
.status.warn{background:#fff6dc;border:2px solid #f3c64d;color:#6a4b00}
.status svg{width:24px;height:24px;flex:none}

/* ===== Toast umpan balik ===== */
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{min-width:380px;max-width:760px;display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-radius:14px;font-size:15.5px;line-height:1.38;box-shadow:0 12px 26px rgba(0,0,0,.45);border:3px solid #fff;animation:tin .25s ease-out;pointer-events:auto}
.toast b{display:block;font-size:17px;margin-bottom:2px}
.toast.ok{background:linear-gradient(180deg,#e9fff0,#c7f5d4);color:#0f5626;border-color:#43c467}
.toast.bad{background:linear-gradient(180deg,#fff1f0,#ffd6d2);color:#8c1a13;border-color:#ee6b62}
.toast.info{background:linear-gradient(180deg,#eef6ff,#d3e7ff);color:#103b80;border-color:#5aa0f2}
.toast.warn{background:linear-gradient(180deg,#fffbe9,#ffecb0);color:#644700;border-color:#f0b92a}
.toast .ic{flex:none;width:34px;height:34px}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}

/* ===== Modal ===== */
#modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(3,10,20,.7)}
#modal.show{display:flex}
.mbox{width:640px;max-height:640px;display:flex;flex-direction:column;background:linear-gradient(180deg,#fbfdff,#e9f1fa);border:4px solid #2f7de0;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.55);overflow:hidden;animation:pop .25s ease-out}
.mbox.wide{width:900px}
.mbox .mh{background:linear-gradient(180deg,#2a74d8,#123f8a);color:#fff;font-weight:900;font-style:italic;font-size:22px;padding:14px 20px;display:flex;gap:10px;align-items:center}
.mbox .mh svg{width:28px;height:28px}
.mbox .mc{padding:18px 22px;overflow:auto;font-size:16px;line-height:1.5;color:#14263a}
.mbox .mf{display:flex;gap:12px;justify-content:center;padding:14px 18px 18px;flex-wrap:wrap}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.stars{display:flex;gap:10px;justify-content:center;margin:6px 0 10px}
.stars svg{width:64px;height:64px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.stars svg.pop{animation:starpop .45s ease-out both}
@keyframes starpop{0%{transform:scale(.2) rotate(-40deg);opacity:0}70%{transform:scale(1.2)}100%{transform:none;opacity:1}}
.bigscore{text-align:center;font-size:46px;font-weight:900;color:#123f8a;line-height:1}
.bigscore small{display:block;font-size:15px;color:var(--muted);font-weight:700;margin-top:4px}

/* ===== Laman muka ===== */
.home-title{position:absolute;left:250px;top:18px;width:640px;display:flex;align-items:center;gap:6px}
.logo-gear{width:150px;height:150px;flex:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.logo-text{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-left:-20px}
.lt1{font-size:36px;font-weight:900;font-style:italic;color:#fff;background:linear-gradient(180deg,#2a7be8,#0e3f96);border:3px solid #9fd0ff;padding:2px 26px;border-radius:10px;transform:skewX(-12deg);text-shadow:0 3px 0 rgba(0,0,0,.35);box-shadow:0 6px 14px rgba(0,0,0,.4);letter-spacing:.5px}
.lt2{white-space:nowrap;font-size:50px;font-weight:900;font-style:italic;color:#ffd21f;background:linear-gradient(180deg,#f0402f,#b0140d);border:4px solid #ffd76a;padding:0 26px;border-radius:12px;transform:skewX(-12deg);text-shadow:0 4px 0 #6a0c06,0 0 1px #000;box-shadow:0 8px 18px rgba(0,0,0,.45);letter-spacing:.5px;margin-left:24px;line-height:1.2}
.lt3{position:relative;font-size:24px;font-weight:900;font-style:italic;color:#1a2633;background:linear-gradient(180deg,#ffffff,#c3ccd6 55%,#8f9caa);border:3px solid #fff;padding:1px 70px;border-radius:8px;transform:skewX(-12deg);letter-spacing:3px;margin-left:110px;box-shadow:0 6px 12px rgba(0,0,0,.4);overflow:hidden}
.lt3::before,.lt3::after{content:"";position:absolute;top:0;bottom:0;width:52px;background:conic-gradient(#1a2633 25%,#fff 0 50%,#1a2633 0 75%,#fff 0) 0 0/12px 12px;opacity:.85}
.lt3::before{left:6px}.lt3::after{right:6px}
.home-menu{position:absolute;right:46px;top:178px;display:flex;flex-direction:column;gap:14px;width:330px}
.mbtn{display:flex;align-items:center;gap:14px;height:70px;padding:0 18px 0 10px;border-radius:20px;font-size:25px;font-weight:900;font-style:italic;color:#fff;border:3px solid rgba(255,255,255,.9);box-shadow:0 7px 0 rgba(0,0,0,.3),0 12px 22px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s,box-shadow .15s}
.mbtn .ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.95);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.mbtn .ico svg{width:30px;height:30px}
.mbtn:hover{transform:translateX(-6px) scale(1.04);filter:brightness(1.12);box-shadow:0 7px 0 rgba(0,0,0,.3),0 0 26px rgba(255,214,90,.65),inset 0 3px 0 rgba(255,255,255,.35)}
.mbtn:focus-visible{outline:4px solid #fff;outline-offset:3px}
.mbtn.y{background:linear-gradient(180deg,#ffe066,#ffb703 55%,#f08c00);color:#2a1a00;text-shadow:0 1px 0 rgba(255,255,255,.45)}
.mbtn.bl{background:linear-gradient(180deg,#56aaff,#1a63d1 60%,#0f469f)}
.mbtn.g{background:linear-gradient(180deg,#68e48a,#1f9f45 60%,#137532)}
.mbtn.p{background:linear-gradient(180deg,#9b8cff,#5a45d6 60%,#3f2fa8)}
.mbtn.r{background:linear-gradient(180deg,#ff6e62,#d42d22 60%,#a01a13);height:58px;font-size:21px}
.mbtn.r .ico{width:44px;height:44px}
.welcome{position:absolute;left:28px;top:300px;width:300px;background:rgba(255,255,255,.96);border-radius:16px;border:3px solid #fff;box-shadow:0 12px 24px rgba(0,0,0,.4);overflow:hidden}
.welcome .wh{background:linear-gradient(90deg,#ffc61a,#ffe066);color:#14263a;font-weight:900;font-style:italic;font-size:17px;padding:9px 14px;line-height:1.2}
.welcome p{padding:10px 14px 14px;font-size:14.5px;line-height:1.45;color:#1b2b3d}
.infobar{position:absolute;left:28px;right:28px;bottom:18px;height:84px;display:flex;align-items:center;background:linear-gradient(180deg,#123f8a,#0a2554);border:3px solid #ffc61a;border-radius:16px;box-shadow:0 10px 20px rgba(0,0,0,.45);color:#fff}
.infobar>div{flex:1;display:flex;align-items:center;gap:14px;padding:0 22px;border-right:2px solid rgba(255,255,255,.25);height:56px}
.infobar>div:last-child{border:none}
.infobar svg{width:44px;height:44px;flex:none}
.infobar small{display:block;font-size:13px;font-weight:700;color:#cfe3ff}
.infobar b{display:block;font-size:17px;font-style:italic;color:#ffd21f;line-height:1.2}

/* ===== Kartu umum ===== */
.cards{display:grid;gap:14px}
.card{background:#fff;border-radius:14px;border:2px solid var(--line);padding:12px 14px;box-shadow:0 4px 10px rgba(10,30,60,.08)}
.card h4{font-size:16px;font-weight:900;color:#123f8a;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.card p,.card li{font-size:14.5px;line-height:1.45;color:#1d2f43}
.card ul,.card ol{padding-left:20px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:#e7f1ff;color:#123f8a;border:1px solid #9cc4f5}
.tag.g{background:#e3f9e9;color:#11632b;border-color:#83d79b}
.tag.y{background:#fff6dc;color:#6a4b00;border-color:#f3c64d}
.tag.r{background:#ffeceb;color:#9a1d16;border-color:#f3a59f}
.scrollable{overflow:auto;scrollbar-width:thin;scrollbar-color:#7da3d1 transparent}
.scrollable::-webkit-scrollbar{width:8px}
.scrollable::-webkit-scrollbar-thumb{background:#7da3d1;border-radius:4px}

/* ===== Peta misi ===== */
.mapwrap{position:absolute;left:24px;right:24px;top:80px;bottom:92px}
.mission{position:absolute;width:286px;background:linear-gradient(180deg,#fbfdff,#e6eef8);border-radius:18px;border:3px solid #2f7de0;box-shadow:0 10px 24px rgba(0,0,0,.45);overflow:hidden}
.mission .mhd{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;font-weight:900;font-style:italic;font-size:16.5px;line-height:1.15}
.mission .mhd .badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:900;font-style:normal;background:rgba(255,255,255,.95);color:#123f8a;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.mission.A .mhd{background:linear-gradient(180deg,#2a74d8,#123f8a)}
.mission.B .mhd{background:linear-gradient(180deg,#f2a400,#c26a00)}
.mission.C .mhd{background:linear-gradient(180deg,#25a84d,#137532)}
.mission.D .mhd{background:linear-gradient(180deg,#e2362f,#9e1913)}
.mission .acts{padding:9px 10px 10px;display:flex;flex-direction:column;gap:7px}
.act{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:#fff;border:2px solid #cfdcec;border-radius:12px;padding:7px 9px;font-size:14px;font-weight:700;color:#14263a;transition:transform .12s,border-color .12s,box-shadow .12s}
.act:hover{transform:translateX(3px);border-color:#3b93ff;box-shadow:0 4px 10px rgba(29,111,224,.2)}
.act:focus-visible{outline:3px solid var(--yellow)}
.act .code{flex:none;width:30px;height:30px;border-radius:9px;background:#e7f1ff;color:#123f8a;font-weight:900;display:grid;place-items:center;font-size:13px}
.act .t{flex:1;line-height:1.2}
.act .st{display:flex;gap:1px}
.act .st svg{width:15px;height:15px}
.act.done{border-color:#7fd497;background:#f3fff6}
.mission.locked .acts{filter:grayscale(1);opacity:.55}
.mission .lockov{position:absolute;inset:auto 0 0 0;top:60px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#fff;font-weight:900;text-align:center;font-size:14px;background:rgba(10,20,35,.55)}
.mission.locked .lockov{display:flex}
.mission .lockov svg{width:44px;height:44px}
.mprog{height:7px;background:#d9e3ef;margin:0 12px 10px;border-radius:4px;overflow:hidden}
.mprog i{display:block;height:100%;background:linear-gradient(90deg,#ffc61a,#22a447)}

/* ===== Aktivitas umum ===== */
.area{position:absolute;left:0;right:0;top:72px;bottom:86px}
.taskcard{position:absolute;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#fff7d6,#ffe58a);border:3px solid #fff;border-radius:16px;padding:9px 16px;box-shadow:0 8px 18px rgba(0,0,0,.35);color:#3b2a00;font-size:16px;font-weight:800;line-height:1.3}
.taskcard svg{width:34px;height:34px;flex:none}
.calbox{position:absolute;background:rgba(255,255,255,.06);border-radius:16px}
.calbox svg{display:block;width:100%;height:100%}
.slider-g{cursor:grab}
.slider-g:focus{outline:none}
.slider-g:focus-visible .sl-body{stroke:#ffc61a;stroke-width:.8}
.dragging .slider-g{cursor:grabbing}
.part-hit{cursor:pointer}
.part-hit:hover{filter:brightness(1.12) drop-shadow(0 0 2px #3b93ff)}
.hl-part{filter:drop-shadow(0 0 1.5px #ffb300) drop-shadow(0 0 3px #ffb300)}
.nudge{display:flex;gap:6px;align-items:center}
.nudge .btn{min-width:46px}
.stripbox{position:absolute;background:linear-gradient(180deg,#fff8d8,#ffe8a0);border:4px solid #ffc61a;border-radius:16px;box-shadow:0 10px 22px rgba(0,0,0,.4);overflow:hidden}
.stripbox .slab{position:absolute;top:6px;padding:3px 12px;border-radius:999px;background:linear-gradient(180deg,#1f5fc4,#0d2f6b);color:#fff;font-weight:900;font-style:italic;font-size:13px;border:2px solid #9fd0ff;z-index:2;pointer-events:none}
.stripbox .zctl{position:absolute;right:8px;bottom:6px;display:flex;gap:6px;z-index:3}
.zbtn{width:34px;height:34px;border-radius:10px;background:#123f8a;color:#fff;border:2px solid #9fd0ff;font-size:20px;font-weight:900;display:grid;place-items:center;line-height:1}
.zbtn:hover{background:#1d6fe0}
.zbtn:focus-visible{outline:3px solid #ffc61a}
.zbtn svg{width:18px;height:18px}
.stripbox svg.ssvg{position:absolute;left:0;top:0;display:block;width:100%;height:100%;touch-action:none}
.precbadge{position:absolute;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fff,#eaf1f9);border:3px solid #ffc61a;border-radius:14px;padding:6px 14px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.precbadge small{display:block;font-size:12px;font-weight:800;color:#6a4b00;background:#ffc61a;margin:-6px -14px 4px;padding:3px 14px}
.precbadge b{font-size:22px;font-weight:900;color:#0d1b2a}
.counter{position:absolute;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#fff,#eaf1f9);border:3px solid #ffc61a;border-radius:14px;padding:4px 14px;box-shadow:0 6px 14px rgba(0,0,0,.35);font-weight:900;color:#0d1b2a}
.counter small{font-size:12px;color:#6a4b00}
.counter b{font-size:22px}
.lives{display:flex;gap:4px}
.lives svg{width:24px;height:24px}
.timer{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:17px;color:#fff;background:rgba(5,15,30,.8);border:2px solid #3a6ea8;border-radius:999px;padding:6px 14px}
.timer.low{border-color:#ff6b5e;color:#ffd1cc;animation:pulse 1s infinite}
.timer svg{width:20px;height:20px}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,107,94,.25)}}
.choice{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:3px solid #cfdcec;border-radius:14px;padding:9px 12px;font-size:15px;font-weight:800;color:#14263a;text-align:left;transition:transform .12s,border-color .12s,background .12s}
.choice:hover{border-color:#3b93ff;transform:translateY(-2px);box-shadow:0 6px 12px rgba(29,111,224,.18)}
.choice:focus-visible{outline:3px solid var(--yellow)}
.choice.sel{border-color:#1d6fe0;background:#e9f3ff}
.choice.ok{border-color:#22a447;background:#e8fbee}
.choice.bad{border-color:#e2362f;background:#ffefee;animation:shake .35s}
.choice[disabled]{cursor:default}
.choice svg.ci{width:42px;height:42px;flex:none}
.carousel{position:absolute;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(18,63,138,.95),rgba(10,37,84,.95));border:3px solid #ffc61a;border-radius:16px;padding:8px 12px;box-shadow:0 10px 20px rgba(0,0,0,.4)}
.carousel .cl{color:#fff;font-weight:900;font-style:italic;font-size:15px;line-height:1.15;width:110px}
.comp{width:128px;height:88px;border-radius:12px;background:#fff;border:3px solid #cfdcec;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:3px 4px 4px;position:relative;transition:transform .12s,border-color .12s}
.comp:hover{transform:translateY(-3px);border-color:#3b93ff}
.comp:focus-visible{outline:3px solid var(--yellow)}
.comp svg{width:100%;height:58px}
.comp span{font-size:12.5px;font-weight:900;color:#14263a}
.comp.sel{border-color:#ffc61a;background:#fff7d6;box-shadow:0 0 0 3px rgba(255,198,26,.45)}
.comp .ck{position:absolute;right:-6px;top:-6px;width:24px;height:24px;display:none}
.comp.done .ck{display:block}
.typebtn{display:flex;align-items:center;gap:10px;width:100%;height:72px;border-radius:14px;border:3px solid #cfdcec;background:#fff;padding:0 10px;font-size:15.5px;font-weight:900;font-style:italic;color:#14263a;text-align:left;line-height:1.1;transition:transform .12s}
.typebtn svg{width:46px;height:46px;flex:none}
.typebtn:hover{transform:translateX(3px)}
.typebtn.on{background:linear-gradient(180deg,#ffe066,#ffb703);border-color:#fff;box-shadow:0 0 0 3px rgba(255,198,26,.5)}
.typebtn:focus-visible{outline:3px solid var(--yellow)}
.inset{position:absolute;border:3px solid #fff;border-radius:14px;background:#26374d;box-shadow:0 8px 18px rgba(0,0,0,.45);overflow:hidden}
.inset .il{position:absolute;left:8px;top:6px;font-size:12px;font-weight:900;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:999px;z-index:2}
.inset svg{display:block;width:100%;height:100%}
.contact{position:absolute;display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;border-radius:999px;padding:6px 14px;border:2px solid #fff;box-shadow:0 6px 12px rgba(0,0,0,.35)}
.contact.no{background:#fff1d6;color:#7a4d00}
.contact.yes{background:#dcfbe5;color:#0f5c27}
.contact svg{width:20px;height:20px}

/* 3D */
.three-wrap{position:absolute;border-radius:18px;overflow:hidden}
.three-wrap canvas{display:block;width:100%!important;height:100%!important;touch-action:none;cursor:grab}
.three-wrap canvas:active{cursor:grabbing}
.hot{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.hot i{display:block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffb300);border:2px solid #fff;box-shadow:0 0 0 3px rgba(255,179,0,.35),0 2px 6px rgba(0,0,0,.4)}
.hot span{position:absolute;left:50%;bottom:var(--dy,20px);transform:translateX(var(--dx,-50%));white-space:nowrap;font-size:13px;font-weight:900;color:#1b1400;background:linear-gradient(180deg,#ffe066,#ffc61a);border:2px solid #fff;border-radius:999px;padding:3px 10px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.hot.sel i{background:radial-gradient(circle at 35% 30%,#bfe0ff,#1d6fe0);box-shadow:0 0 0 5px rgba(29,111,224,.4)}
.hot.sel span{background:linear-gradient(180deg,#56aaff,#1a63d1);color:#fff}
.hot.found i{background:radial-gradient(circle at 35% 30%,#b8f7c9,#22a447)}
.partlist{display:flex;flex-direction:column;gap:7px}
.pbtn{display:flex;align-items:center;gap:10px;width:100%;height:50px;border-radius:12px;border:2px solid #cfdcec;background:#fff;padding:0 10px;font-size:14.5px;font-weight:900;font-style:italic;color:#14263a;text-align:left;line-height:1.1;transition:transform .12s}
.pbtn:hover{transform:translateX(3px);border-color:#3b93ff}
.pbtn.on{background:linear-gradient(180deg,#ffe066,#ffb703);border-color:#fff;box-shadow:0 0 0 3px rgba(255,198,26,.5)}
.pbtn.seen::after{content:"✓";margin-left:auto;color:#22a447;font-style:normal;font-size:18px}
.pbtn:focus-visible{outline:3px solid var(--yellow)}
.pbtn svg{width:58px!important;height:36px!important;flex:none;background:linear-gradient(180deg,#1d4f9a,#0d2f6b);border-radius:7px}

/* drag & drop */
.dz{border:3px dashed #8fb3dc;border-radius:12px;background:rgba(231,241,255,.7);min-height:46px;display:flex;align-items:center;justify-content:center;padding:4px;transition:background .12s,border-color .12s;font-size:13px;color:#5b6b7f;font-weight:700;text-align:center}
.dz.over,.dz.target{border-color:#ffb300;background:#fff7d6}
.dz.filled{border-style:solid;border-color:#22a447;background:#eafbef}
.dcard{display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,#fff,#eef4fb);border:3px solid #9fb6cf;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:800;color:#14263a;line-height:1.25;cursor:grab;touch-action:none;user-select:none;box-shadow:0 4px 8px rgba(10,30,60,.15);transition:transform .1s,border-color .1s}
.dcard:hover{border-color:#3b93ff}
.dcard.sel{border-color:#ffb300;box-shadow:0 0 0 4px rgba(255,179,0,.4);transform:translateY(-2px)}
.dcard.placed{cursor:default;border-color:#22a447;background:#eafbef}
.dcard.ghost{position:fixed;z-index:100;pointer-events:none;opacity:.92;transform:rotate(-2deg) scale(1.03);box-shadow:0 14px 26px rgba(0,0,0,.4)}
.dcard:focus-visible{outline:3px solid var(--yellow)}
.dcard.bad{animation:shake .35s;border-color:#e2362f}

/* evaluasi */
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qn{width:38px;height:38px;border-radius:10px;border:2px solid #9fb6cf;background:#fff;font-weight:900;color:#14263a;font-size:15px}
.qn.ans{background:#e7f1ff;border-color:#3b93ff}
.qn.cur{background:linear-gradient(180deg,#ffe066,#ffb703);border-color:#fff;box-shadow:0 0 0 3px rgba(255,198,26,.5)}
.qn.ok{background:#e3f9e9;border-color:#22a447}
.qn.bad{background:#ffeceb;border-color:#e2362f}
.ordlist{display:flex;flex-direction:column;gap:7px}
.orditem{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #cfdcec;border-radius:12px;padding:6px 8px 6px 12px;font-size:15px;font-weight:700}
.orditem .on{width:26px;height:26px;border-radius:50%;background:#123f8a;color:#fff;font-weight:900;display:grid;place-items:center;font-size:13px;flex:none}
.orditem .tx{flex:1}
.orditem .mv{display:flex;gap:4px}
.orditem .mv button{width:34px;height:34px;border-radius:9px;background:#e7f1ff;border:2px solid #9cc4f5;font-weight:900;color:#123f8a}
.orditem .mv button:hover{background:#cfe3ff}
table.rekap{width:100%;border-collapse:collapse;font-size:14px}
table.rekap th,table.rekap td{padding:6px 8px;border-bottom:1px solid #d6e0ec;text-align:left}
table.rekap th{background:#123f8a;color:#fff;font-weight:800}
table.rekap td.n{text-align:center;font-weight:800}
textarea.refl{width:100%;min-height:62px;border-radius:10px;border:2px solid #9fb6cf;padding:8px 10px;font-size:14.5px;resize:none;outline:none}
textarea.refl:focus{border-color:#3b93ff}

/* rotasi HP */
#rotate{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(4,12,24,.94);color:#fff;text-align:center;padding:30px;font-size:17px;line-height:1.45}
#rotate.show{display:flex}
#rotate svg{width:90px;height:90px}
#rotate button{margin-top:6px;background:#ffc61a;color:#1d1300;font-weight:900;padding:12px 22px;border-radius:12px;font-size:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media print{
  body{background:#fff}
  #stage{transform:none!important;left:0;top:0;box-shadow:none}
  #bg,#bgx,.hud,.bnav,#toast,.noprint{display:none!important}
}

.hot.down span{bottom:auto;top:var(--dy,20px)}
.steps.sm{gap:5px}.steps.sm li{font-size:13.5px;line-height:1.3}.steps.sm li .n{width:22px;height:22px;font-size:12px}

/* ===== Latar penuh kiri-kanan (mengisi area di luar stage 16:9) ===== */
#bgx{position:fixed;inset:0;z-index:0;overflow:hidden;background:#050b14}
#bgx .bgx-svg,#bgx .bgx-dim,#bgx .bgx-splash{position:absolute;inset:0}
#bgx .bgx-svg svg{width:100%;height:100%;display:block}
#bgx .bgx-svg{transition:filter .3s}
#bgx.soft .bgx-svg{filter:blur(var(--bgx-blur,2.5px))}
#bgx .bgx-dim{top:var(--st-top);height:var(--st-h);bottom:auto;opacity:0;transition:opacity .2s}
#bgx .bgx-dim::before,#bgx .bgx-dim::after{content:"";position:absolute;left:0;right:0;height:100vh}
#bgx .bgx-dim::before{bottom:100%}#bgx .bgx-dim::after{top:100%}
#bgx.dim .bgx-dim{opacity:1;background:linear-gradient(180deg,rgba(6,16,30,.74),rgba(6,16,30,.6) 40%,rgba(6,16,30,.8))}
#bgx.dim .bgx-dim::before{background:rgba(6,16,30,.74)}#bgx.dim .bgx-dim::after{background:rgba(6,16,30,.8)}
#bgx.dim.light .bgx-dim{background:linear-gradient(180deg,rgba(6,16,30,.45),rgba(6,16,30,.2) 45%,rgba(6,16,30,.55))}
#bgx.dim.light .bgx-dim::before{background:rgba(6,16,30,.45)}#bgx.dim.light .bgx-dim::after{background:rgba(6,16,30,.55)}
#bgx .bgx-splash{opacity:0;pointer-events:none;transition:opacity .6s ease;
  background:repeating-linear-gradient(-45deg,#ffc61a 0 var(--sp-s22),#1a1a1a var(--sp-s22) var(--sp-s44)) 0 var(--st-top)/100% var(--sp-s16) no-repeat,
  repeating-linear-gradient(-45deg,#ffc61a 0 var(--sp-s22),#1a1a1a var(--sp-s22) var(--sp-s44)) 0 calc(var(--st-top) + var(--st-h) - var(--sp-s16))/100% var(--sp-s16) no-repeat,
  repeating-linear-gradient(90deg,rgba(159,208,255,.07) 0 1px,transparent 1px var(--sp-s40)) var(--st-left) 0/auto,
  repeating-linear-gradient(0deg,rgba(159,208,255,.07) 0 1px,transparent 1px var(--sp-s40)) 0 var(--st-top)/auto,
  radial-gradient(ellipse var(--sp-rx) var(--sp-ry) at var(--sp-cx) var(--sp-cy),#16407f 0%,#0a1d38 55%,#050b14 100%)}
body.splashing #bgx .bgx-splash{opacity:1}
#bgx::after{content:"";position:absolute;inset:0;background:rgba(3,10,20,.7);opacity:0;pointer-events:none}
#bgx.modal::after{opacity:1}
/* ===== Splash screen ===== */
#splash{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff;
  background:radial-gradient(ellipse 1040px 760px at 640px 288px,#16407f 0%,#0a1d38 55%,#050b14 100%);transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(159,208,255,.07) 0 1px,transparent 1px 40px),
  repeating-linear-gradient(0deg,rgba(159,208,255,.07) 0 1px,transparent 1px 40px)}
#splash::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(-45deg,#ffc61a 0 22px,#1a1a1a 22px 44px);opacity:.9}
.sp-stripe{position:absolute;left:0;right:0;top:0;height:16px;background:repeating-linear-gradient(-45deg,#ffc61a 0 22px,#1a1a1a 22px 44px);opacity:.9}
.sp-kicker{position:relative;font-size:16px;font-weight:800;letter-spacing:4px;color:#9fd0ff;text-transform:uppercase;margin-bottom:6px;animation:spUp .7s .1s both}
.sp-logo{position:relative;display:flex;align-items:center;gap:6px;animation:spPop .8s .25s both}
.sp-logo .logo-gear{width:190px;height:190px;animation:spSway 3s ease-in-out infinite}
.sp-logo .lt2{font-size:60px}
.sp-ruler{position:relative;width:560px;height:46px;margin-top:34px;animation:spUp .7s .55s both}
.sp-ruler .rl{position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,#eef3f8,#b9c5d2);border:2px solid #fff;overflow:hidden;
  background-image:repeating-linear-gradient(90deg,#1a2633 0 2px,transparent 2px 11.2px),linear-gradient(180deg,#eef3f8,#b9c5d2);background-size:100% 14px,100% 100%;background-repeat:no-repeat}
.sp-ruler .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(29,111,224,.25),rgba(59,147,255,.55))}
.sp-ruler .jaw{position:absolute;top:-14px;left:0;width:18px;height:74px;margin-left:-9px;border-radius:4px;background:linear-gradient(90deg,#ffe066,#ffb703 55%,#f08c00);box-shadow:0 4px 10px rgba(0,0,0,.45);border:2px solid #fff6cc}
.sp-read{position:relative;margin-top:22px;font-size:18px;font-weight:700;color:#cfe3ff;min-height:24px;animation:spUp .7s .7s both}
.sp-read b{color:var(--yellow);font-variant-numeric:tabular-nums;font-size:22px}
.sp-go{position:relative;margin-top:18px;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s;pointer-events:none}
#splash.ready .sp-go{opacity:1;transform:none;pointer-events:auto;animation:spPulse 1.6s 1s ease-in-out infinite}
@keyframes spUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spPop{0%{opacity:0;transform:scale(.7)}70%{opacity:1;transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes spSway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes spPulse{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.28),0 0 0 0 rgba(255,198,26,.6)}50%{box-shadow:0 6px 0 rgba(0,0,0,.28),0 0 0 14px rgba(255,198,26,0)}}
@media print{#splash{display:none!important}}
</style>
</head>
<body>
<div id="bgx" aria-hidden="true"><div class="bgx-svg"></div><div class="bgx-dim"></div><div class="bgx-splash"></div></div>
<div id="stage">
  <div id="bg"></div>
  <div id="screen"></div>
  <div id="toast" aria-live="polite"></div>
  <div id="modal"></div>
  <div id="splash" role="dialog" aria-label="Layar pembuka"></div>
</div>
<svg id="gdefs" width="0" height="0" style="position:absolute;left:0;top:0" aria-hidden="true" focusable="false"></svg>
<div id="rotate" role="dialog" aria-label="Putar perangkat">
  <svg viewBox="0 0 64 64" fill="none" stroke="#ffc61a" stroke-width="3"><rect x="18" y="6" width="28" height="48" rx="4"/><path d="M8 40a24 24 0 0 0 20 18M56 24A24 24 0 0 0 36 6" stroke-linecap="round"/><path d="M28 58l-4-4 4-4M36 6l4 4-4 4" stroke-linecap="round"/></svg>
  <p><b>Putar perangkat ke posisi mendatar</b><br>Media ini dirancang untuk layar 16:9 agar tampilan lebih jelas.</p>
  <button type="button">Tetap Lanjutkan</button>

function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function randStep(min, max, step) { const n = Math.floor((max - min) / step); return min + rand(0, n) * step; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
/* angka per-seratus mm -> teks Indonesia */
function fmt100(v100, dec) { if (dec === undefined) dec = (v100 % 10 === 0) ? 1 : 2; return (v100 / 100).toFixed(dec).replace('.', ','); }
function fmtN(n, dec = 0) { return Number(n).toFixed(dec).replace('.', ','); }
function parse100(str) {
  if (str === null || str === undefined) return NaN;
  const s = String(str).trim().replace(/\s|mm/gi, '').replace(',', '.');
  if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
  return Math.round(parseFloat(s) * 100);
}

/* ---------- Penyimpanan (localStorage + cadangan memori) ---------- */
const STORE = (() => {
  let mem = null;
  function read() {
    try { const t = localStorage.getItem(CONFIG.storageKey); if (t) return JSON.parse(t); } catch (e) { }
    return mem;
  }
  function write(o) { mem = JSON.parse(JSON.stringify(o)); try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(o)); } catch (e) { } }
  return { read, write };
})();
function freshState() { return { v: 1, act: {}, eval: null, refl: ['', '', ''], settings: { sfx: true, music: true, unlockAll: false }, seenGuide: false }; }
let S = Object.assign(freshState(), STORE.read() || {});
if (!S.settings) S.settings = freshState().settings;
function save() { STORE.write(S); updateHUD(); }
function actRec(id) { return S.act[id] || (S.act[id] = { best: 0, done: false, tries: 0 }); }
function allActs() { return MISSIONS.flatMap(m => m.acts.map(a => Object.assign({ mission: m.id, mjudul: m.judul }, a))); }
function actInfo(id) { return allActs().find(a => a.id === id); }
function doneCount() { return allActs().filter(a => S.act[a.id] && S.act[a.id].done).length; }
function totalXP() { return allActs().reduce((s, a) => s + ((S.act[a.id] && S.act[a.id].best) || 0), 0) + ((S.eval && S.eval.best) || 0); }
function avgActs() { const a = allActs(); return Math.round(a.reduce((s, x) => s + ((S.act[x.id] && S.act[x.id].best) || 0), 0) / a.length); }
function missionUnlocked(mid) {
  if (S.settings.unlockAll) return true;
  const idx = MISSIONS.findIndex(m => m.id === mid);
  if (idx <= 0) return true;
  return MISSIONS[idx - 1].acts.every(a => S.act[a.id] && S.act[a.id].done);
}
function missionDone(mid) { const m = MISSIONS.find(x => x.id === mid); return m.acts.every(a => S.act[a.id] && S.act[a.id].done); }

/* ---------- Audio (Web Audio API, disintesis — tanpa file eksternal) ---------- */
const AU = (() => {
  let ctx = null, master, sfxG, musG, noiseBuf, slideSrc, slideG, musicTimer = null, ambSrc = null, mood = 'menu', step = 0, tinkTimer = null;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    sfxG = ctx.createGain(); sfxG.gain.value = 0.55; sfxG.connect(master);
    musG = ctx.createGain(); musG.gain.value = 0.0; musG.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // gesekan kontinu
    slideSrc = ctx.createBufferSource(); slideSrc.buffer = noiseBuf; slideSrc.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 1.4;
    slideG = ctx.createGain(); slideG.gain.value = 0;
    slideSrc.connect(bp); bp.connect(slideG); slideG.connect(sfxG); slideSrc.start();
    return true;
  }
  function tone(f, dur, type = 'sine', vol = .25, t0 = 0, f2 = null, dest = null) {
    if (!ctx) return; const t = ctx.currentTime + t0;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxG); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, freq, q, vol, t0 = 0, dest = null) {
    if (!ctx) return; const t = ctx.currentTime + t0;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || sfxG); s.start(t, Math.random()); s.stop(t + dur + .05);
  }
  const on = () => S.settings.sfx && init();
  const api = {
    unlock() { init(); if (S.settings.music) api.startMusic(); },
    click() { if (!on()) return; tone(1250, .05, 'triangle', .18); noise(.03, 4000, 2, .08); },
    soft() { if (!on()) return; tone(900, .04, 'sine', .1); },
    ok() { if (!on()) return; tone(660, .14, 'triangle', .22); tone(990, .22, 'triangle', .22, .1); tone(1320, .25, 'sine', .1, .18); },
    err() { if (!on()) return; tone(220, .22, 'square', .09, 0, 150); tone(165, .25, 'sawtooth', .05, .06, 110); },
    lock() { if (!on()) return; noise(.05, 5200, 3, .3); tone(140, .09, 'sine', .3, 0, 70); noise(.04, 2500, 4, .18, .07); },
    touch() { if (!on()) return; noise(.04, 3400, 5, .22); tone(2100, .06, 'sine', .07); },
    tick() { if (!on()) return; tone(1800, .03, 'square', .06); },
    pop() { if (!on()) return; tone(520, .08, 'sine', .2, 0, 880); },
    win() { if (!on()) return; [523, 659, 784, 1046].forEach((f, i) => tone(f, .3, 'triangle', .2, i * .11)); tone(1318, .6, 'sine', .12, .45); tone(784, .7, 'sine', .08, .45); },
    lose() { if (!on()) return; [392, 330, 262].forEach((f, i) => tone(f, .32, 'triangle', .18, i * .16)); },
    slide(intensity) {
      if (!S.settings.sfx || !ctx) return;
      const t = ctx.currentTime; const v = Math.min(.16, .03 + intensity * .05);
      slideG.gain.cancelScheduledValues(t); slideG.gain.setTargetAtTime(v, t, .01); slideG.gain.setTargetAtTime(0, t + .06, .05);
    },
    setMood(m) { mood = m; },
    startMusic() {
      if (!S.settings.music || !init() || musicTimer) return;
      musG.gain.cancelScheduledValues(ctx.currentTime);
      musG.gain.setTargetAtTime(0.5, ctx.currentTime, .8);
      step = 0; schedule();
      // ambience bengkel: noise rendah + denting logam sesekali
      ambSrc = ctx.createBufferSource(); ambSrc.buffer = noiseBuf; ambSrc.loop = true;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320;
      const ag = ctx.createGain(); ag.gain.value = .045; ambSrc.connect(lp); lp.connect(ag); ag.connect(musG); ambSrc.start();
      const tink = () => { if (!musicTimer) return; const f = rand(2200, 3600); tone(f, .5, 'sine', .018, 0, f * .995, musG); tone(f * 1.51, .35, 'sine', .01, .01, null, musG); tinkTimer = setTimeout(tink, rand(6000, 13000)); };
      tinkTimer = setTimeout(tink, 4000);
    },
    stopMusic() {
      if (!ctx) return;
      clearTimeout(musicTimer); musicTimer = null; clearTimeout(tinkTimer);
      musG.gain.setTargetAtTime(0, ctx.currentTime, .2);
      if (ambSrc) { try { ambSrc.stop(ctx.currentTime + .6); } catch (e) { } ambSrc = null; }
    }
  };
  // sekuens musik latar lembut (elektronik ringan) — tempo mengikuti suasana layar
  const CH = [[48, 55, 59, 64], [45, 52, 55, 60], [41, 48, 52, 57], [43, 50, 55, 59]];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function schedule() {
    const bpm = mood === 'tantangan' ? 108 : mood === 'fokus' ? 84 : 96;
    const dur = 60 / bpm / 2;
    const chord = CH[Math.floor(step / 8) % 4];
    const i = step % 8;
    if (i === 0) chord.forEach((n, k) => tone(mtof(n + 12), dur * 8, k ? 'sine' : 'triangle', .035, 0, null, musG));
    if (i % 4 === 0) tone(mtof(chord[0] - 12), dur * 2.5, 'sine', .09, 0, null, musG);
    const arp = [0, 2, 1, 3, 2, 1, 3, 2][i];
    tone(mtof(chord[arp] + 24), dur * .9, 'triangle', mood === 'fokus' ? .018 : .028, 0, null, musG);
    if (mood === 'tantangan' && i % 2 === 1) noise(.03, 7000, 1, .02, 0, musG);
    step++;
    musicTimer = setTimeout(schedule, dur * 1000);
  }
  return api;
})();

/* ---------- Routing (SPA, tanpa pindah halaman) ---------- */
const SCREENS = {};
let CUR = null, CUR_CLEAN = null;
const ORDER = ['ikhtisar', 'identifikasi', 'fungsi-komponen', 'skala-utama', 'skala-nonius', 'hitung-pengukuran', 'diameter-luar', 'diameter-dalam', 'kedalaman', 'pilih-alat', 'studi-kasus', 'validasi-hasil', 'rangkuman', 'evaluasi', 'hasil', 'umpan-balik', 'pengulangan'];
function reg(id, def) { SCREENS[id] = def; }
function go(id, params = {}, fromPop = false) {
  if (!SCREENS[id]) id = 'beranda';
  const info = actInfo(id);
  if (info && !missionUnlocked(info.mission) && !params.force) { lockedModal(info.mission); return; }
  if (CUR_CLEAN) { try { CUR_CLEAN(); } catch (e) { console.warn(e); } }
  CUR_CLEAN = null; closeModal(true); clearToasts();
  const sc = $('#screen'); sc.innerHTML = '';
  const root = h('<div class="scr"></div>'); sc.appendChild(root);
  CUR = id;
  $('#bg').classList.toggle('soft', id !== 'beranda');
  AU.setMood(SCREENS[id].mood || 'menu');
  const r = SCREENS[id].render(root, params);
  if (typeof r === 'function') CUR_CLEAN = r;
  if (!fromPop) { try { history.pushState({ id }, '', '#' + id); } catch (e) { } }
  syncBgxMood();
  updateHUD();
  const f = root.querySelector('[data-autofocus]'); if (f) setTimeout(() => f.focus({ preventScroll: true }), 50);
}
window.addEventListener('popstate', e => { const id = (e.state && e.state.id) || 'beranda'; go(id, {}, true); });
function nextOf(id) { const i = ORDER.indexOf(id); return i >= 0 && i < ORDER.length - 1 ? ORDER[i + 1] : null; }
function prevOf(id) { const i = ORDER.indexOf(id); return i > 0 ? ORDER[i - 1] : 'beranda'; }
function lockedModal(mid) {
  const idx = MISSIONS.findIndex(m => m.id === mid);
  const prev = MISSIONS[idx - 1];
  AU.err();
  modal({
    title: 'Misi ' + mid + ' Masih Terkunci', icon: IC.lock,
    html: `<p>Selesaikan dulu semua aktivitas pada <b>Misi ${prev.id}: ${prev.judul}</b> untuk membuka misi ini.</p><p style="margin-top:8px;color:#5b6b7f;font-size:14px">Guru atau kurator dapat membuka semua misi melalui <b>Mode Guru</b> di halaman Panduan.</p>`,
    buttons: [{ label: 'Ke Misi ' + prev.id, cls: 'b-blue', click: () => go(prev.acts.find(a => !(S.act[a.id] && S.act[a.id].done)).id) }, { label: 'Tutup', cls: 'b-dark' }]
  });
}

/* ---------- Penyelesaian aktivitas ---------- */
function finishAct(id, score, o = {}) {
  score = clamp(Math.round(score), 0, 100);
  const r = actRec(id); const isBest = score > r.best;
  r.best = Math.max(r.best, score); r.done = true; r.tries = (r.tries || 0) + 1; save();
  const st = starsOf(score);
  const next = nextOf(id); const info = actInfo(id);
  AU.win();
  const msg = score >= 90 ? 'Luar biasa! Kamu bekerja seperti teknisi profesional.' : score >= 70 ? 'Bagus! Sedikit lagi menuju sempurna.' : 'Aktivitas selesai. Coba ulangi agar hasilmu lebih teliti.';
  let starHTML = ''; for (let i = 0; i < 3; i++) starHTML += (i < st ? IC.star : IC.starE).replace('<svg', `<svg class="pop" style="animation-delay:${i * .15}s"`);
  const unlockMsg = (info && missionDone(info.mission) && MISSIONS.findIndex(m => m.id === info.mission) < 3) ? `<div class="status ok" style="margin-top:10px">${IC.check}Misi ${info.mission} selesai! Misi berikutnya sudah terbuka.</div>` : '';
  modal({
    title: (o.title || 'Aktivitas Selesai!'), icon: IC.trophy, lock: true,
    html: `<div class="stars">${starHTML}</div><div class="bigscore">${score}<small>poin ${isBest ? '— rekor baru!' : '(rekor terbaik: ' + r.best + ')'}</small></div><p style="text-align:center;margin-top:10px;font-weight:700">${msg}</p>${o.extra || ''}${unlockMsg}`,
    buttons: [
      next ? { label: 'Lanjutkan', cls: 'b-green', icon: IC.right, click: () => go(next) } : null,
      { label: 'Ulangi', cls: 'b-yellow', icon: IC.refresh, click: () => go(id) },

/* ---------- Drag & drop generik (dengan alternatif ketuk) ---------- */
function makeDnD(o) {
  /* o: {cards:[el], zones:[el], accept(card, zone)->bool, onDrop(card,zone,ok)} */
  let sel = null;
  const clearSel = () => { if (sel) sel.classList.remove('sel'); sel = null; o.zones.forEach(z => z.classList.remove('target')); };
  function tryDrop(card, zone) {
    if (!zone || zone.classList.contains('filled') || card.classList.contains('placed')) return;
    const ok = o.accept(card, zone); o.onDrop(card, zone, ok);
  }
  o.cards.forEach(card => {
    card.setAttribute('tabindex', '0'); card.setAttribute('role', 'button');
    card.addEventListener('click', () => {
      if (card.classList.contains('placed') || card._dragged) { card._dragged = false; return; }
      if (sel === card) { clearSel(); return; }
      clearSel(); sel = card; card.classList.add('sel'); AU.soft();
      o.zones.forEach(z => { if (!z.classList.contains('filled')) z.classList.add('target'); });
    });
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); } });
    card.addEventListener('pointerdown', e => {
      if (card.classList.contains('placed') || e.button > 0) return;
      const sx = e.clientX, sy = e.clientY; let ghost = null, moved = false, overZ = null;
      const move = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.hypot(dx, dy) > 8) {
          moved = true; ghost = card.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel');
          const r = card.getBoundingClientRect(); ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
          ghost.style.transform = `scale(${stageScale}) rotate(-2deg)`; ghost.style.transformOrigin = 'top left';
          document.body.appendChild(ghost); ghost._ox = sx - r.left; ghost._oy = sy - r.top;
        }
        if (ghost) {
          ghost.style.left = (ev.clientX - ghost._ox) + 'px'; ghost.style.top = (ev.clientY - ghost._oy) + 'px';
          const el = document.elementFromPoint(ev.clientX, ev.clientY); const z = el && el.closest('.dz');
          if (overZ && overZ !== z) overZ.classList.remove('over'); overZ = z && o.zones.includes(z) ? z : null; if (overZ) overZ.classList.add('over');
        }
      };
      const up = ev => {
        document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        if (ghost) { ghost.remove(); card._dragged = true; if (overZ) { overZ.classList.remove('over'); clearSel(); tryDrop(card, overZ); } setTimeout(() => card._dragged = false, 50); }
      };
      document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    });
  });
  o.zones.forEach(z => {
    z.setAttribute('tabindex', '0');
    const act = () => { if (sel) { const c = sel; clearSel(); tryDrop(c, z); } };
    z.addEventListener('click', act);
    z.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
  });
  return { clearSel };
}

/* ---------- Timer & nyawa (untuk Tantangan Bengkel) ---------- */
function makeTimer(el, seconds, onEnd) {
  let left = seconds, id = null, paused = false;
  const render = () => { el.innerHTML = `${IC.clock}<span>${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span>`; el.classList.toggle('low', left <= 15); };
  render();
  return {
    start() { if (id) return; id = setInterval(() => { if (paused) return; left--; if (left <= 10 && left > 0) AU.tick(); render(); if (left <= 0) { clearInterval(id); id = null; onEnd && onEnd(); } }, 1000); },
    stop() { clearInterval(id); id = null; },
    pause(p) { paused = p; },
    get left() { return left; }
  };
}

  const onUp = e => { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) { const p = pickAt(e.clientX, e.clientY); if (pickCb) pickCb(p); } down = null; };
  const onLeave = () => { if (hover) { hover = null; paint(); render(); } };
  el.addEventListener('pointermove', onMove); el.addEventListener('pointerdown', onDown); el.addEventListener('pointerup', onUp); el.addEventListener('pointerleave', onLeave);
  render();
  return {
    is3D: true,
    onPick(cb) { pickCb = cb; },
    select(p) { selected = p; paint(); render(); },
    markFound(p) { found.add(p); render(); },
    showLabels(on) { labelsOn = on; render(); },
    resetView() { camera.position.copy(homePos); controls.target.copy(target); controls.update(); render(); },
    dispose() {
      el.removeEventListener('pointermove', onMove); el.removeEventListener('pointerdown', onDown); el.removeEventListener('pointerup', onUp); el.removeEventListener('pointerleave', onLeave);
      controls.dispose(); scene.traverse(m => { if (m.geometry) m.geometry.dispose(); if (m.material) (Array.isArray(m.material) ? m.material : [m.material]).forEach(x => { if (x.map) x.map.dispose(); x.dispose(); }); });
      renderer.renderLists.dispose(); renderer.domElement.remove();
    }
  };
}

/* cadangan 2D bila WebGL tidak tersedia */
function makeCaliper2DPicker(container) {
  container.innerHTML = '<svg viewBox="-24 -32 262 100" style="width:100%;height:100%"></svg>';
  const cal = new Caliper2D(container.querySelector('svg'), { prec: 10, v100: 4000 });
  let cb = null;
  container.querySelector('svg').addEventListener('click', e => { const p = e.target.closest('[data-part]'); if (cb) cb(p ? p.dataset.part : null); });
  container.querySelectorAll('[data-part]').forEach(e => e.classList.add('part-hit'));
  container.insertAdjacentHTML('beforeend', '<div class="status warn" style="position:absolute;left:10px;bottom:10px;font-size:13px">Tampilan 3D tidak didukung perangkat ini — memakai tampilan 2D.</div>');
  return { is3D: false, onPick(f) { cb = f; }, select(p) { cal.highlight(p); }, markFound() { }, showLabels() { }, resetView() { }, dispose() { } };
}

function tpStatus(tp) {
  const sc = tp.acts.map(a => (S.act[a] && S.act[a].best) || 0); const avg = sc.reduce((a, b) => a + b, 0) / sc.length;
  if (tp.acts.every(a => S.act[a] && S.act[a].done) && avg >= CONFIG.kktp) return ['Tercapai', 'g', avg];
  if (sc.some(x => x > 0)) return ['Berproses', 'y', avg];
  return ['Belum', '', avg];
}

/* =====================================================================
   MISI B — Membaca Skala Ukur
   b1 skala-utama, b2 skala-nonius, b3 hitung-pengukuran

function randV(prec, lo = 8, hi = 125) { const { N } = vernierSpec(prec); return rand(lo, hi) * 100 + rand(1, N - 1) * prec; }
function precTxt(p) { return p === 5 ? '0,05' : '0,1'; }
function addLens(cal) {
  const { N, dv } = vernierSpec(cal.prec);
  cal.slider.insertAdjacentHTML('beforeend', `<rect x="-3" y="11.5" width="${N * dv + 6}" height="14" rx="1.6" fill="none" stroke="#ffc61a" stroke-width="3" ${NS} pointer-events="none"/>`);
}
/* kerangka layar laboratorium skala (dipakai b1, b2, b3) */
function scaleLab(root, id, title) {
  const sh = shell(root, id, title, '');
  const area = sh.area;
  area.innerHTML = `
    <div class="stripbox" style="left:20px;top:4px;width:860px;height:196px"></div>
    <div class="calbox" style="left:20px;top:212px;width:860px;height:290px"><svg viewBox="-24 -32 262 100" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="counter" style="left:28px;top:418px"><small>Latihan</small><b class="cnt">1/4</b></div>
    <div class="precbadge" style="left:660px;top:434px"><span><small>Ketelitian Jangka Sorong</small><b class="prv">0,1 mm</b></span></div>
    <div class="nudgebar" style="position:absolute;left:240px;top:446px;display:none"></div>
    <div class="panel side" style="left:896px;top:4px;right:20px;bottom:4px">
      <div class="ph">${IC.clip.replace('<svg', '<svg style="width:22px"')}Langkah Membaca Hasil Ukur</div>
      <div class="pb">
        <ul class="steps">
          <li data-s="1"><span class="n">1</span><span>Baca <b>skala utama</b>: garis tepat <b>sebelum</b> (di kiri) angka 0 skala nonius.</span></li>
          <li data-s="2"><span class="n">2</span><span>Cari garis <b>skala nonius</b> yang berimpit (segaris) dengan garis skala utama.</span></li>
          <li data-s="3"><span class="n">3</span><span>Hasil = skala utama + (nomor garis nonius × ketelitian alat).</span></li>
        </ul>
        <div class="task" style="margin-top:12px"></div>
      </div></div>`;
  const strip = new ScaleStrip($('.stripbox', area), { w: 852, h: 188, prec: 10, v100: 2340, zoom: 1, zmax: 5 });
  const cal = new Caliper2D($('.calbox svg', area), { prec: 10, v100: 2340 });
  addLens(cal);
  return {
    sh, area, strip, cal, task: $('.task', area),
    setItem(i, n, prec, v100) {
      $('.cnt', area).textContent = (i + 1) + '/' + n;
      $('.prv', area).textContent = precTxt(prec) + ' mm';
      if (cal.prec !== prec) { cal.setPrec(prec); addLens(cal); }
      cal.set(v100); strip.prec = prec; strip.v100 = v100; strip.pan = 0; strip.zoom = 1; strip.clearMarks();
      sh.setStep(i + 1, n, 'Latihan ' + (i + 1) + ' dari ' + n);
    },
    hiStep(k) { $$('.steps li', area).forEach(li => { const s = +li.dataset.s; li.classList.toggle('cur', s === k); li.classList.toggle('done', s < k); }); }
  };
}
function pointsFor(tries) { return tries === 0 ? 1 : tries === 1 ? .6 : tries === 2 ? .25 : 0; }

/* ---------- b1: identifikasi skala utama ---------- */
reg('skala-utama', {

        if (tries >= 3) {

}

/* ---------- d3: cocokkan hasil pengukuran ---------- */
function genMatchSet(prec) {
  const { N } = vernierSpec(prec);
  for (let t = 0; t < 50; t++) {
    const m = rand(12, 110), k1 = rand(1, N - 1); let k2 = rand(1, N - 1); if (k2 === k1) continue;
    const vals = [m * 100 + k1 * prec, m * 100 + k2 * prec, (m + 1) * 100 + k1 * prec, (m + 2) * 100 + k2 * prec];
    if (new Set(vals).size === 4) return shuffle(vals);
  }
  return [2340, 2370, 2440, 2570];
}

function buildEval() {
  const qs = [];
  // bacaan skala bergambar (0,1 dan 0,05)
  [10, 5].forEach(p => {
    const v = randV(p, 10, 120); const { main, k } = readingParts(v, p);
    const opts = new Set([v]); const alt = [v + 100, v - 100, main * 100 + (p === 5 ? k * 10 : k * 100), v + p, v - p].filter(x => x > 0 && x !== v && Math.floor(x / 100) <= 150);
    shuffle(alt).forEach(x => { if (opts.size < 4) opts.add(x); });
    const o = shuffle([...opts]);
    qs.push({ t: 'mc', img: 'strip', prec: p, v, q: `Perhatikan kaca pembesar skala jangka sorong berketelitian ${precTxt(p)} mm. Hasil pembacaannya adalah …`, o: o.map(x => fmt100(x, p === 5 ? 2 : 1) + ' mm'), a: o.indexOf(v), b: `Skala utama ${main} mm, garis nonius ke-${k} berimpit → ${main} + (${k} × ${precTxt(p)}) = ${fmt100(v, p === 5 ? 2 : 1)} mm.` });
  });
  // hitungan isian
  const p = pick([10, 5]); const { N } = vernierSpec(p); const m = rand(12, 90), k = rand(1, N - 1); const v = m * 100 + k * p;
  qs.push({ t: 'num', q: `Skala utama menunjukkan ${m} mm dan garis nonius ke-${k} berimpit dengan garis skala utama. Ketelitian alat ${precTxt(p)} mm. Berapa hasil pengukurannya?`, v, prec: p, b: `${m} + (${k} × ${precTxt(p)}) = ${fmt100(v, p === 5 ? 2 : 1)} mm.` });
  // identifikasi bagian bergambar
  const part = pick(PART_ORDER); const others = shuffle(PART_ORDER.filter(x => x !== part)).slice(0, 3); const o = shuffle([part, ...others]);
  qs.push({ t: 'mc', img: 'part', part, q: 'Bagian jangka sorong yang ditunjuk panah merah adalah …', o: o.map(x => PARTS[x].nama), a: o.indexOf(part), b: `Bagian tersebut adalah ${PARTS[part].nama}: ${PARTS[part].fungsi}` });
  // urutkan prosedur
  qs.push({ t: 'ord', q: 'Urutkan langkah mengukur diameter luar poros dengan jangka sorong (gunakan tombol ▲ ▼).', items: ['Bersihkan rahang dan periksa titik nol', 'Letakkan poros di antara rahang luar', 'Geser rahang sampai menyentuh poros', 'Kencangkan sekrup pengunci', 'Baca skala dengan mata tegak lurus'], b: 'Urutan benar: bersihkan & cek nol → letakkan benda → geser rahang sampai menyentuh → kunci → baca skala.' });
  shuffle(EVAL_MC).slice(0, CONFIG.jumlahSoalEvaluasi - qs.length).forEach(x => { const idx = shuffle([0, 1, 2, 3]); qs.push({ t: 'mc', q: x.q, o: idx.map(i => x.o[i]), a: idx.indexOf(x.a), b: x.b }); });
  return shuffle(qs).map(q => { if (q.t === 'ord') q.cur = shuffle(q.items.map((_, i) => i)); return q; });
}
function qCorrect(q) {
  if (q.t === 'mc') return q.ans === q.a;
  if (q.t === 'num') return parse100(q.ans) === q.v;
  if (q.t === 'ord') return q.touched && q.cur.every((v, i) => v === i);
}
function qAnswered(q) { return q.t === 'ord' ? !!q.touched : (q.ans !== undefined && q.ans !== ''); }

    shell(root, 'pengulangan', 'Ulangi Aktivitas', IC.refresh);
    const area = $('.area', root);
    area.innerHTML = `
      <div style="position:absolute;left:20px;right:20px;top:4px;bottom:4px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:start">
        ${MISSIONS.map(m => `<div class="mission ${m.id}" style="position:relative;width:auto"><div class="mhd"><span class="badge">${m.id}</span><span>MISI ${m.id}<br>${m.judul}</span></div><div class="acts">${m.acts.map(a => { const r = S.act[a.id]; return `<button class="act ${r && r.done ? 'done' : ''}" data-act="${a.id}"><span class="code">${a.code}</span><span class="t">${a.judul}<br><small style="color:#5b6b7f">${r && r.done ? 'Rekor: ' + r.best + ' poin' : 'Belum dikerjakan'}</small></span>${IC.refresh.replace('<svg', '<svg width="20" height="20" style="color:#1d6fe0"')}</button>`; }).join('')}</div></div>`).join('')}
      </div>
      <div class="panel" style="left:20px;right:20px;bottom:4px;height:110px"><div class="ph">${IC.gear}Pilihan Lain</div><div class="pb" style="display:flex;gap:12px;align-items:center">
        <button class="btn b-sm b-yellow" data-go="evaluasi">${IC.clip.replace('<svg', '<svg style="width:20px"')}Ulangi Evaluasi</button>
        <button class="btn b-sm b-blue" data-go="rangkuman">${IC.book}Baca Rangkuman</button>
        <span style="flex:1;font-size:14px;color:#33475e">Mengulang aktivitas tidak menurunkan rekor terbaikmu.</span>
        <button class="btn b-sm b-red rs">${IC.refresh}Hapus Semua Progres</button></div></div>`;
    $$('.act', area).forEach(b => b.onclick = () => { AU.click(); go(b.dataset.act); });
    $('.rs', area).onclick = () => { AU.click(); confirmReset(); };
  }
});

/* ---- main.js ---- */
/* ===== Mulai aplikasi ===== */
(function boot() {
  document.getElementById('gdefs').innerHTML = '<defs>' + GLOBAL_DEFS + '</defs>';
  document.getElementById('bg').innerHTML = workshopBG();
  document.querySelector('#bgx .bgx-svg').innerHTML = workshopBG().replace(/ id="(bg[A-Za-z]+)"/g, ' id="x$1"').replace(/url\(#(bg[A-Za-z]+)\)/g, 'url(#x$1)');
  document.body.classList.add('splashing');
  new MutationObserver(() => document.getElementById('bgx').classList.toggle('modal', document.getElementById('modal').classList.contains('show'))).observe(document.getElementById('modal'), { attributes: true, attributeFilter: ['class'] });
  fitStage();
  window.addEventListener('resize', fitStage);
  const rot = document.getElementById('rotate');
  rot.querySelector('button').onclick = () => { rot.dataset.dismissed = '1'; rot.classList.remove('show'); };
  const start = (location.hash || '').slice(1);
  go(SCREENS[start] && start !== 'penutup' ? start : 'beranda', { force: true }, true);
  try { history.replaceState({ id: CUR }, '', '#' + CUR); } catch (e) { }
  splash();
  if (!document.getElementById('splash')) document.body.classList.remove('splashing');
})();

/* ===== Splash screen pembuka ===== */
function splash() {
  const el = document.getElementById('splash'); if (!el) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.innerHTML = `<div class="sp-stripe"></div>
    <div class="sp-kicker">${esc(CONFIG.jenis)} · ${esc(CONFIG.programKeahlian)}</div>
    <div class="sp-logo">${logoGearSVG(190)}<div class="logo-text"><div class="lt1">PENGUKURAN</div><div class="lt2">JANGKA SORONG</div><div class="lt3">OTOMOTIF</div></div></div>
    <div class="sp-ruler" aria-hidden="true"><div class="rl"><div class="fill"></div></div><div class="jaw"></div></div>
    <div class="sp-read" aria-live="polite">Mengkalibrasi jangka sorong… <b>0,00 mm</b></div>
    <button class="btn b-yellow sp-go" type="button">${IC.play}KETUK UNTUK MULAI</button>`;
  const fill = el.querySelector('.fill'), jaw = el.querySelector('.jaw'), rd = el.querySelector('.sp-read'), btn = el.querySelector('.sp-go');
  const MAX = 150, DUR = reduce ? 1 : 2400, t0 = performance.now() + (reduce ? 0 : 700);
  let raf, done = false;
  function step(now) {
    const k = clamp((now - t0) / DUR, 0, 1), e = 1 - Math.pow(1 - k, 3);
    fill.style.width = (e * 100) + '%'; jaw.style.left = (e * 100) + '%';
    rd.querySelector('b').textContent = fmtN(e * MAX, 2) + ' mm';
    if (k < 1) raf = requestAnimationFrame(step);
    else { rd.innerHTML = 'Alat siap digunakan! <b>Kalibrasi OK ✓</b>'; el.classList.add('ready'); btn.focus({ preventScroll: true }); }
  }
  raf = requestAnimationFrame(step);
  function close() {
    if (done) return; done = true; cancelAnimationFrame(raf);
    try { AU.click(); } catch (e) { }
    el.classList.add('out'); document.body.classList.remove('splashing');
    setTimeout(() => { el.remove(); const f = document.querySelector('#screen [data-autofocus]'); if (f) f.focus({ preventScroll: true }); }, 650);
  }
  btn.onclick = close;
  el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') && el.classList.contains('ready')) { e.preventDefault(); close(); } });
}
